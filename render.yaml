# One-click deploy to Render (https://render.com) — free tier works (CPU).
services:
  - type: web
    name: visionai
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: YOLO_MODEL_NAME
        value: yolov8n.pt
      - key: FACE_MATCH_THRESH
        value: "0.363"
